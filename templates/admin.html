<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="admin-body">
    <div class="admin-container" style="max-width: 400px;">
        {% if needs_login %}
            <h2 style="margin-top:0;">Вход в админку</h2>
            {% if error %}<p style="color:red; font-size: 13px;">{{ error }}</p>{% endif %}
            <form method="POST">
                <input type="password" name="password" placeholder="Введите пароль" required class="input-field">
                <button type="submit" class="btn-primary">Войти</button>
            </form>
        {% else %}
            <h2 style="margin-top:0;">Управление сайтом</h2>
            <form action="/update-settings" method="POST">
                <label style="font-size:12px; font-weight:bold;">Имя мастера:</label>
                <input type="text" name="name" value="{{ data.name }}" required class="input-field">
                
                <label style="font-size:12px; font-weight:bold;">Номер телефона:</label>
                <input type="text" name="phone" value="{{ data.phone }}" required class="input-field">
                
                <label style="font-size:12px; font-weight:bold;">Ссылка на фото профиля (Аватарка):</label>
                <input type="text" name="avatar_url" value="{{ data.avatar_url }}" required class="input-field">
                
                <button type="submit" class="btn-submit">Сохранить изменения</button>
            </form>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

            <h3>Смена пароля админки</h3>
            <form action="/change-password" method="POST">
                <label style="font-size:12px; font-weight:bold;">Новый пароль (минимум 6 символов):</label>
                <input type="password" name="new_password" placeholder="Введите новый пароль" required class="input-field" minlength="6">
                <button type="submit" class="btn-primary" style="background: #333;">Изменить пароль</button>
            </form>

            <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
                <a href="/" style="color: #d4af37; text-decoration: none; font-size: 13px; font-weight: bold;">← На сайт</a>
                <a href="/logout" style="color: #e74c3c; text-decoration: none; font-size: 13px; font-weight: bold;">Выйти</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
